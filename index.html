<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Lita-lab スタッフツール</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@600;700&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{ --rose:#C8848C; --rose-pale:#F7EDEE; --gold:#B8923A; --ink:#3a3236; }
  *{box-sizing:border-box;}
  body{margin:0; font-family:"Noto Sans JP",sans-serif; background:linear-gradient(160deg,#f7f1ec,#f2e6e8); color:var(--ink); min-height:100vh; padding:28px 18px 40px;}
  .head{text-align:center; margin-bottom:26px;}
  .head h1{font-family:"Noto Serif JP",serif; font-size:24px; margin:0; letter-spacing:.06em;}
  .head h1 span{color:var(--rose);}
  .head p{font-size:13px; color:var(--gold); margin:6px 0 0; letter-spacing:.08em;}
  .grid{max-width:520px; margin:0 auto; display:grid; gap:14px;}
  a.card{display:flex; align-items:center; gap:14px; background:#fff; border-radius:16px; padding:18px 18px; text-decoration:none; color:var(--ink); box-shadow:0 2px 10px rgba(0,0,0,.07); border:1px solid #eaddE0; transition:transform .1s;}
  a.card:active{transform:scale(.98);}
  .ic{width:48px; height:48px; border-radius:12px; background:var(--rose-pale); display:flex; align-items:center; justify-content:center; font-size:24px; flex:none;}
  .tx b{display:block; font-size:16px; font-weight:700;}
  .tx small{color:#8a7f78; font-size:12.5px;}
  .foot{text-align:center; font-size:11.5px; color:#a99ea1; margin-top:26px; line-height:1.7;}
</style>
</head>
<body>
  <div class="head">
    <h1>Lita-lab <span>スタッフツール</span></h1>
    <p>頭皮から未来を整える</p>
  </div>
  <div class="grid">
    <a class="card" href="follow.html">
      <div class="ic">💬</div>
      <div class="tx"><b>LINEフォロー文メーカー</b><small>タップで選ぶ → お客様へのLINE文を作成</small></div>
    </a>
    <a class="card" href="shindan.html">
      <div class="ic">📊</div>
      <div class="tx"><b>頭皮診断（サロン版）</b><small>iPadで採点 → タイプ判定</small></div>
    </a>
    <a class="card" href="mirai.html">
      <div class="ic">🔮</div>
      <div class="tx"><b>頭皮未来診断 Ver2</b><small>お客様と一緒に未来を見る</small></div>
    </a>
    <a class="card" href="mihon.html">
      <div class="ic">🖼</div>
      <div class="tx"><b>頭皮コンディション見本表</b><small>お客様に状態を見せる図解</small></div>
    </a>
  </div>
  <div class="foot">
    Lita-lab 内部スタッフ用ページ<br>
    ※お客様情報はどこにも保存されません（文章を作るだけの道具です）
  </div>
</body>
</html>
